<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ops Center · Get Outside Mid-Atlantic</title>
<style>
body{margin:0;background:#0b1220;color:#e8eef7;font-family:system-ui,sans-serif}
#boot{padding:2.5rem;text-align:center;line-height:1.6;max-width:36rem;margin:0 auto}
a{color:#7dd3fc}
code{background:#1e293b;padding:.15rem .4rem;border-radius:4px;font-size:.9em}
</style>
</head>
<body>
<div id="boot">Loading Ops Center…</div>
<script>
(async function () {
  const boot = document.getElementById('boot');
  function fail(msg) {
    boot.innerHTML = '<p style="font-size:1.15rem;font-weight:600">Ops Center failed to load</p>' +
      '<p style="opacity:.8;margin:1rem 0">' + (msg || '') + '</p>' +
      '<p style="margin-top:1.5rem"><a href="/">← Home</a></p>';
    console.error(msg);
  }
  function paint(html) {
    document.open();
    document.write(html);
    document.close();
    try {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './ops-layers.css';
      (document.head || document.documentElement).appendChild(link);
    } catch (e) { console.warn('ops-layers.css inject failed', e); }
  }
  try {
    const r = await fetch('./map.html', { cache: 'no-store' });
    if (!r.ok) throw new Error('map.html HTTP ' + r.status);
    const html = await r.text();
    if (html.indexOf('<!DOCTYPE') === -1 && html.indexOf('<html') === -1)
      throw new Error('map.html is not HTML');
    paint(html);
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
