<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sports Operations Center (SOC) · Get Outside Mid-Atlantic</title>
<style>body{margin:0;background:#0b1220;color:#e8eef7;font-family:system-ui,sans-serif}
#boot{padding:2rem;text-align:center;line-height:1.5}</style>
</head>
<body>
<div id="boot">Loading Sports Operations Center…</div>
<script>
(async function () {
  const boot = document.getElementById('boot');
  function paint(html) {
    document.open();
    document.write(html);
    document.close();
  }
  // 1) Local chunked parts (preferred when filled with real map HTML)
  try {
    const ids = [];
    for (let i = 1; i <= 32; i++) ids.push(i);
    const parts = await Promise.all(ids.map(i =>
      fetch('./parts/p' + i + '.txt', { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('part ' + i + ' ' + r.status);
        return r.text();
      })
    ));
    const joined = parts.join('');
    // Reject placeholder-only payloads
    if (joined.indexOf('<!DOCTYPE') !== -1 && joined.indexOf('PLACEHOLDER_PART') === -1) {
      paint(joined);
      return;
    }
  } catch (e) {
    console.warn('local parts unavailable', e);
  }
  // 2) Fallback: known public SOC map (works without GUI upload)
  try {
    boot.textContent = 'Loading map from backup source…';
    const r = await fetch(
      'https://raw.githubusercontent.com/getoutsidemidatl/getoutside/main/sports/index.html',
      { cache: 'no-store' }
    );
    if (!r.ok) throw new Error('backup HTTP ' + r.status);
    paint(await r.text());
  } catch (e) {
    boot.innerHTML =
      '<p>SOC failed to load.</p>' +
      '<p style="opacity:.7">' + (e && e.message ? e.message : e) + '</p>' +
      '<p><a style="color:#7dd3fc" href="/">Home</a></p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
