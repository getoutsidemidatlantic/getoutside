<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sports Operations Center (SOC) · Get Outside Mid-Atlantic</title>
<style>body{margin:0;background:#0b1220;color:#e8eef7;font-family:system-ui,sans-serif}
#boot{padding:2rem;text-align:center}</style>
</head>
<body>
<div id="boot">Loading Sports Operations Center…</div>
<script>
(async function(){
  try {
    const parts = await Promise.all([1,2,3,4].map(i =>
      fetch('./parts/p'+i+'.txt', {cache:'no-store'}).then(r => {
        if(!r.ok) throw new Error('part '+i+' '+r.status);
        return r.text();
      })
    ));
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('boot').innerHTML =
      '<p>SOC failed to load.</p><p style="opacity:.7">'+e.message+'</p><p><a style="color:#7dd3fc" href="/">Home</a></p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
