<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1220;color:#e8eef7;overflow:hidden}
header{background:linear-gradient(90deg,#020617 0%,#0a1628 55%,#0c1a2e 100%);padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e3a55;flex-wrap:wrap;gap:8px;z-index:1100;position:relative;min-height:56px}
/* brand wordmark replaces h1 */

#main{padding-bottom:36px;display:flex;height:calc(100vh - 48px)}

.layers-title{padding:12px 14px 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7f9a;font-weight:700}

.layer-item:hover{background:rgba(255,255,255,.04)}

.soc-icon.nfl{background:#1d4ed8}.soc-icon.mlb{background:#dc2626}.soc-icon.mls{background:#16a34a}
.soc-icon.soccer{background:linear-gradient(135deg,#16a34a,#db2777)}.soc-icon.practice{background:linear-gradient(135deg,#f59e0b,#d97706)}
.soc-icon.college{background:linear-gradient(135deg,#7c3aed,#5b21b6)}.soc-icon.milb{background:#b45309}
#panel{position:fixed;top:48px;right:-420px;width:380px;max-width:90vw;height:calc(100vh - 48px);background:#0f1a2e;border-left:1px solid #2a4a6a;z-index:1200;transition:right .28s ease;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.4)}

.panel-venue{font-weight:700;font-size:1.05rem;color:#7dd3fc;margin-bottom:2px}

.panel-chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.chip.count{background:#1a7f4e;color:#fff}.chip.practice{background:#d97706;color:#fff}
.chip.college{background:#7c3aed;color:#fff}.chip.outdoor{background:#166534;color:#bbf7d0}
.panel-body{flex:1;overflow-y:auto;padding:12px 14px}

.event-card-head{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start}
.event-card-head:hover{background:rgba(255,255,255,.03)}
.event-date{font-size:.7rem;color:#38bdf8;font-weight:600}
.event-teams{font-size:.88rem;font-weight:600;color:#e8eef7;margin-top:2px;line-height:1.3}
.event-sport{font-size:.7rem;color:#8ba0bc;margin-top:2px}
.event-expand{color:#6b7f9a;font-size:.72rem;margin-top:2px}
.event-detail{display:none;padding:0 12px 12px;border-top:1px solid #1e3a55;font-size:.78rem;line-height:1.45;color:#c5d4e8}
.event-card.open .event-detail{display:block}
.event-card.open .event-expand::after{content:" ▲"}
.event-card:not(.open) .event-expand::after{content:" ▼"}
.detail-row{margin-top:8px}
.detail-label{font-size:.62rem;text-transform:uppercase;color:#6b7f9a;letter-spacing:.04em}
.detail-outdoor{color:#86efac;margin-top:4px}
.detail-links{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.detail-links a{font-size:.7rem;color:#7dd3fc;text-decoration:none;background:rgba(56,189,248,.1);padding:4px 10px;border-radius:6px;border:1px solid #1e4a6a}
.panel-footer{padding:10px 14px;border-top:1px solid #1e3a55;flex-shrink:0}
.panel-footer a{font-size:.76rem;color:#7dd3fc;text-decoration:none;background:rgba(56,189,248,.12);padding:6px 12px;border-radius:6px;border:1px solid #1e4a6a;display:inline-block}
.leaflet-popup-content-wrapper{background:#0f1a2e;color:#e8eef7;border-radius:10px;border:1px solid #2a4a6a;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:#0f1a2e}
.leaflet-popup-content{margin:10px 12px;min-width:190px}
.popup-mini-title{font-weight:700;color:#7dd3fc;font-size:.9rem}
.popup-mini-meta{font-size:.75rem;color:#a8b8d0;margin-top:2px}
.popup-mini-btn{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:600;background:#1d4ed8;color:#fff;padding:5px 11px;border-radius:6px;border:none;cursor:pointer}
.popup-mini-btn:hover{background:#2563eb}


.live-clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;color:#7dd3fc;letter-spacing:.04em;padding:4px 10px;background:rgba(0,0,0,.25);border:1px solid #1e3a55;border-radius:6px}
.defcon-badge{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;border:1px solid #f59e0b;background:rgba(245,158,11,.12);cursor:default}
.defcon-label{font-size:.62rem;font-weight:700;letter-spacing:.06em;color:#fbbf24}
.defcon-num{font-size:1rem;font-weight:800;color:#fbbf24;font-family:ui-monospace,monospace}
.defcon-badge.d1{border-color:#38bdf8;background:rgba(56,189,248,.1)}
.defcon-badge.d1 .defcon-label,.defcon-badge.d1 .defcon-num{color:#7dd3fc}
.defcon-badge.d2{border-color:#22c55e;background:rgba(34,197,94,.12)}
.defcon-badge.d2 .defcon-label,.defcon-badge.d2 .defcon-num{color:#4ade80}
.defcon-badge.d3{border-color:#eab308;background:rgba(234,179,8,.15)}
.defcon-badge.d3 .defcon-label,.defcon-badge.d3 .defcon-num{color:#facc15}
.defcon-badge.d4{border-color:#f97316;background:rgba(249,115,22,.18)}
.defcon-badge.d4 .defcon-label,.defcon-badge.d4 .defcon-num{color:#fb923c}
.defcon-badge.d5{border-color:#ef4444;background:rgba(239,68,68,.25);box-shadow:0 0 12px rgba(239,68,68,.35)}
.defcon-badge.d5 .defcon-label,.defcon-badge.d5 .defcon-num{color:#f87171}
.fc-weather{font-size:.65rem;color:#94a3b8;margin-top:2px;display:none}
body.show-weather .fc-weather{display:block}


.fc-hype{font-size:.68rem;color:#86efac;margin-top:3px;line-height:1.3;display:none;font-style:italic}
body.show-hype .fc-hype{display:block}
.fc-hype::before{content:"⚡ ";font-style:normal}


.wx-chip{position:absolute;bottom:-4px;right:-6px;background:#0ea5e9;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:4px;border:1px solid #fff;white-space:nowrap;display:none;z-index:2}
body.show-weather-overlay .wx-chip{display:block}
.popup-wx{font-size:.72rem;color:#7dd3fc;margin-top:4px;padding:4px 6px;background:rgba(14,165,233,.12);border-radius:4px;border:1px solid #0e4a6a}


header{background:linear-gradient(90deg,#020617 0%,#0a1628 55%,#0c1a2e 100%);padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e3a55;flex-wrap:wrap;gap:8px;z-index:1100;position:relative;min-height:56px}
.brand{display:flex;align-items:center;gap:12px;padding:8px 0;text-decoration:none;color:inherit}
.brand-mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#16a34a 0%,#0284c7 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(245,158,11,.35),0 4px 12px rgba(0,0,0,.4);flex-shrink:0}
.brand-mark svg{width:22px;height:22px}
.brand-text{display:flex;flex-direction:column;line-height:1.05;gap:1px}
.brand-name{font-family:'Outfit',system-ui,sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.04em;color:#f8fafc}
.brand-name span.amber{color:#f59e0b}
.brand-name span.pine{color:#4ade80}
.brand-sub{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0284c7}

.venue-hype{display:none;margin-bottom:14px;padding:12px;border-radius:10px;background:rgba(22,163,74,.08);border:1px solid rgba(74,222,128,.25)}
body.show-hype .venue-hype{display:block}
.venue-hype-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:#4ade80;font-weight:700;margin-bottom:8px}
.venue-hype-love{font-size:.84rem;color:#e8eef7;line-height:1.4;margin-bottom:8px;font-style:italic}
.venue-hype-meta{font-size:.72rem;color:#a8b8d0;line-height:1.45}
.venue-hype-meta strong{color:#7dd3fc;font-weight:600}


.brand-sub{font-size:.62rem;letter-spacing:.12em}

.soc-icon.d3{background:#6b7280}

/* ===== Phase A: mobile map-first (desktop ≥900px unchanged) ===== */
.mobile-fab{
  display:none;
  position:fixed;
  z-index:1400;
  gap:8px;
  pointer-events:none;
}
.mobile-fab button{
  pointer-events:auto;
  border:1px solid #1e3a55;
  background:rgba(10,18,32,.92);
  color:#e8eef7;
  font-family:inherit;
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.04em;
  padding:10px 14px;
  border-radius:10px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  min-height:44px;
  min-width:44px;
  cursor:pointer;
}
.mobile-fab button.active{
  border-color:#38bdf8;
  color:#7dd3fc;
  background:rgba(14,40,70,.95);
}
.mobile-scrim{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1150;
}


@media (max-width:900px){
  header{
    padding:6px 10px;
    padding-top:max(6px, env(safe-area-inset-top));
    min-height:auto;
    gap:6px;
  }
  .brand-sub{font-size:.55rem;letter-spacing:.08em}
  .header-right{gap:6px}
  .live-clock{font-size:.65rem;padding:3px 6px}
  .defcon-badge{padding:2px 8px}
  .defcon-num{font-size:.9rem}
  .time-filters button{padding:4px 8px;font-size:.7rem}
  .badge{display:none}

  #main{
    height:calc(100dvh - 52px - env(safe-area-inset-top, 0px));
    position:relative;
  }
  #map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
  }

  /* rails off-canvas by default */
  #layers{
    position:fixed;
    top:0;
    left:0;
    width:min(300px, 88vw);
    max-width:320px;
    height:100dvh;
    height:100%;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    transform:translateX(-105%);
    transition:transform .28s ease;
    z-index:1300;
    box-shadow:8px 0 32px rgba(0,0,0,.5);
    border-right:1px solid #2a4a6a;
  }
  body.mobile-layers-open #layers{
    transform:translateX(0);
  }

  #feed{
    position:fixed;
    top:0;
    right:0;
    width:min(340px, 92vw);
    max-width:100%;
    min-width:0;
    height:100dvh;
    height:100%;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    transform:translateX(105%);
    transition:transform .28s ease;
    z-index:1300;
    box-shadow:-8px 0 32px rgba(0,0,0,.5);
    border-left:1px solid #2a4a6a;
  }
  body.mobile-feed-open #feed{
    transform:translateX(0);
  }

  body.mobile-layers-open .mobile-scrim,
  body.mobile-feed-open .mobile-scrim{
    display:block;
  }

  .mobile-fab{
    display:flex;
    left:max(12px, env(safe-area-inset-left));
    bottom:max(16px, env(safe-area-inset-bottom));
  }
  .mobile-fab.feed-fab{
    left:auto;
    right:max(12px, env(safe-area-inset-right));
  }

  #panel{
    top:auto;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    max-width:100%;
    height:min(72dvh, 640px);
    border-left:none;
    border-top:1px solid #2a4a6a;
    border-radius:16px 16px 0 0;
    transform:translateY(110%);
    transition:transform .28s ease;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  #panel.open{
    right:0;
    transform:translateY(0);
  }

  
  body:has(#panel.open) 
}

@media (max-width:1100px) and (min-width:901px){
  #layers{width:180px;min-width:160px}
  #feed{width:280px}
  #panel.open{right:280px}
}


/* Bottom intel ticker (Fox-style crawl) */
.soc-ticker{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;align-items:stretch;height:36px;background:#050b14;border-top:1px solid #f59e0b55;border-bottom:1px solid #1e3a55;font-family:inherit;pointer-events:auto}
.soc-ticker-label{flex-shrink:0;display:flex;align-items:center;padding:0 12px;background:#f59e0b;color:#0f172a;font-size:.68rem;font-weight:800;letter-spacing:.1em}
.soc-ticker-viewport{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.soc-ticker-track{display:flex;align-items:center;gap:0;width:max-content;height:100%;animation:socTickerScroll 45s linear infinite}
.soc-ticker-track:hover{animation-play-state:paused}
@keyframes socTickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.soc-ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 22px;white-space:nowrap;text-decoration:none;color:#e2e8f0;font-size:.78rem;border-right:1px solid #1e3a55}
.soc-ticker-item:hover{color:#fbbf24}
.soc-ticker-tag{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#38bdf8}
.soc-ticker-title{font-weight:600}
.soc-ticker-note{color:#94a3b8;font-size:.72rem}
.soc-ticker-sep{color:#334155;padding:0 4px}
.soc-ticker-meta{flex-shrink:0;display:flex;align-items:center;padding:0 10px;font-size:.62rem;color:#64748b;border-left:1px solid #1e3a55;max-width:90px;overflow:hidden}
.soc-ticker-loading{padding:0 16px;color:#64748b;font-size:.75rem}
/* keep footer visible under ticker */

@media(max-width:700px){
  .soc-ticker{height:32px;bottom:0}
  .soc-ticker-note{display:none}
  .soc-ticker-meta{display:none}
}

</style>

function makeIcon(type, wxLabel){
  const chip = wxLabel ? `<span class="wx-chip">${wxLabel}</span>` : `<span class="wx-chip">WX</span>`;
  return L.divIcon({className:"",html:`<div style="position:relative"><div class="soc-icon ${type}">${iconEmoji[type]||"📍"}</div>${chip}</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-16]});
}
function shortWx(ev){
  if(ev && ev.temp_f) return ev.temp_f + "°";
  const w = (ev && ev.weather) ? ev.weather : (typeof ev === "string" ? ev : "");
  if(!w) return "WX";
  const s = w.toLowerCase();
  if(s.includes("rain")||s.includes("storm")) return "RAIN";
  if(s.includes("clear")||s.includes("sun")||s.includes("crisp")) return "CLR";
  if(s.includes("cloud")) return "CLD";
  if(s.includes("evening")||s.includes("night")) return "EVE";
  if(s.includes("warm")||s.includes("summer")||s.includes("hot")) return "WARM";
  if(s.includes("cool")||s.includes("fall")) return "COOL";
  return "WX";
}
function wxDetail(ev){
  if(!ev) return "";
  const bits = [];
  if(ev.temp_f) bits.push(ev.temp_f + "°F");
  if(ev.humidity) bits.push(ev.humidity + "% RH");
  if(ev.precip_pct != null && ev.precip_pct !== "") bits.push(ev.precip_pct + "% precip");
  if(bits.length) return bits.join(" · ");
  return ev.weather || "";
}
function formatDate(iso){
  if(!iso)return"";
  const d=new Date(iso+"T12:00:00");
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function daysFromToday(iso){
  const d=new Date(iso+"T12:00:00");
  return Math.round((d-TODAY)/(1000*60*60*24));
}
function isWeekend(iso){
  const d=new Date(iso+"T12:00:00");
  const day=d.getDay();
  const diff=daysFromToday(iso);
  return (diff>=0&&diff<=3)||(diff>=0&&diff<=8&&(day===5||day===6||day===0));
}
function typeBadge(t,outdoor){
  let b="";
  if(t==="practice") b+='<span class="fc-badge practice">Practice</span>';
  else if(t==="college") b+='<span class="fc-badge college">D1</span>';
  else if(t==="soccer"||t==="mls") b+='<span class="fc-badge soccer">Soccer</span>';
  else if(t==="mlb") b+='<span class="fc-badge mlb">MLB</span>';
  else if(t==="milb") b+='<span class="fc-badge mlb">MiLB</span>';
  else if(t==="nfl") b+='<span class="fc-badge nfl">NFL</span>';
  if(outdoor==="Yes") b+='<span class="fc-badge outdoor">Outdoor</span>';
  return b;
}
// Normalize type for filtering (mls → soccer)
function normType(t){
  t = (t||"").toLowerCase();
  if(t==="mls"||t==="nwsl") return "soccer";
  if(t==="d1") return "college";
  return t;
}

venues.forEach(v=>{

  }
});
/* Sort sport layer rows by event count descending (overlays stay below divider) */
(function sortSportLayersByCount(){
  const box = document.getElementById('layers');
  if(!box) return;
  const divider = box.querySelector('.layers-divider');
  const sportRows = [...box.querySelectorAll('label.layer-item')].filter(l => l.querySelector('input[data-type]'));
  sportRows.sort((a,b)=>{
    const ta=a.querySelector('input').getAttribute('data-type');
    const tb=b.querySelector('input').getAttribute('data-type');
    return (typeCounts[tb]||0) - (typeCounts[ta]||0);
  });
  const anchor = divider || null;
  sportRows.forEach(row=>{
    if(anchor) box.insertBefore(row, anchor);
    else box.appendChild(row);
  });
})();
/* Clear all layers */
(function(){
  const btn = document.getElementById('btnClearLayers');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#layers input[type=checkbox]').forEach(cb=>{
      if(cb.checked){ cb.checked=false; cb.dispatchEvent(new Event('change',{bubbles:true})); }
    });
  });
})();

const heatPoints=[];
venues.forEach(v=>{
  const intensity=Math.max(.2,Math.min(1,v.eventCount/13));
  const n=Math.max(2,Math.round(v.eventCount*1.2));
  for(let i=0;i<n;i++) heatPoints.push([v.lat+(Math.random()-.5)*.015,v.lon+(Math.random()-.5)*.015,intensity]);
});
const heatLayer=L.heatLayer(heatPoints,{radius:36,blur:26,maxZoom:11,max:1,gradient:{.2:"#0000ff",.4:"#00ff00",.6:"#ffff00",.8:"#ff8800",1:"#ff0000"}}).addTo(map);

function activeTypes(){
  const types=new Set();
  document.querySelectorAll("#layers input[data-type]").forEach(inp=>{
    if(inp.checked) types.add(inp.dataset.type);
  });
  return types;
}

function syncLayers(){
  const types=activeTypes();
  Object.keys(layersByType).forEach(t=>{
    if(types.has(t)) map.addLayer(layersByType[t]);
    else map.removeLayer(layersByType[t]);
  });
  const heatOn=document.getElementById("lyHeat").checked;
  if(heatOn) map.addLayer(heatLayer); else map.removeLayer(heatLayer);
  renderFeed();
}

document.querySelectorAll("#layers input").forEach(inp=>{
  inp.addEventListener("change", syncLayers);
});

let currentRange="7d";
function inDateRange(e){
  const d=daysFromToday(e.date);
  if(d<0) return false;
  if(currentRange==="weekend") return isWeekend(e.date);
  if(currentRange==="7d") return d<=7;
  return d<=30;
}
function inTypeFilter(e){
  return activeTypes().has(normType(e.type));
}

function renderFeed(){
  const items=allFeed.filter(e=>inDateRange(e)&&inTypeFilter(e));
  const mq=marquee.filter(e=>inDateRange(e)&&inTypeFilter(e));
  document.getElementById("feedCount").textContent=items.length;
  let html="";
  if(mq.length){
    html+=`<div class="marquee-section"><div class="marquee-label">Marquee</div>`;
    mq.forEach(e=>{
      html+=`<div class="feed-card marquee" onclick="flyToEvent('${e.venue_id}')">
        <div class="fc-date">${formatDate(e.date)} · ${e.time||""}</div>
        <div class="fc-teams">${e.teams||e.event_name}</div>
        <div class="fc-meta">${e.venue} · ${e.city} ${typeBadge(e.type,e.outdoor)}</div>
        ${(e.temp_f||e.weather)?`<div class="fc-weather">☁ ${e.temp_f? (e.temp_f+'°F · '+e.humidity+'% RH · '+e.precip_pct+'% precip') : e.weather}</div>`:''}
        ${e.enthusiasm?`<div class="fc-hype">${e.enthusiasm}</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  }
  html+=`<div class="marquee-label" style="color:#6b7f9a;margin-top:6px">Upcoming</div>`;
  items.forEach(e=>{
    if(mq.some(m=>m.date===e.date&&m.teams===e.teams)) return;
    html+=`<div class="feed-card" onclick="flyToEvent('${e.venue_id}')">
      <div class="fc-date">${formatDate(e.date)} · ${e.time||""}</div>
      <div class="fc-teams">${e.teams||e.event_name}</div>
      <div class="fc-meta">${e.venue} ${typeBadge(e.type,e.outdoor)}</div>
      ${(e.temp_f||e.weather)?`<div class="fc-weather">☁ ${e.temp_f? (e.temp_f+'°F · '+e.humidity+'% RH · '+e.precip_pct+'% precip') : e.weather}</div>`:''}
      ${e.enthusiasm?`<div class="fc-hype">${e.enthusiasm}</div>`:''}
    </div>`;
  });
  if(!items.length) html+=`<div style="color:#6b7f9a;font-size:.8rem;padding:16px;line-height:1.4">No events match current layers + time filter.<br><br>Turn layers back on or widen the date range.</div>`;
  document.getElementById("feedScroll").innerHTML=html;
}

document.querySelectorAll(".time-filters button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".time-filters button").forEach(b=>b.classList.remove("active"));

  const m=markerById[vid]; if(m) m.openPopup();
};

        ${(e.temp_f||e.weather)?`<div class="detail-row"><div class="detail-label">Weather</div><div>${e.temp_f? (e.temp_f+'°F · Humidity '+e.humidity+'% · Precip '+e.precip_pct+'%') : e.weather}${e.weather && e.temp_f ? ' — '+e.weather : ''}</div></div>`:""}

// Live clock (military / worldmonitor style)

function layerOn(id, fallback=true){
  const el = document.getElementById(id);
  return el ? el.checked : fallback;
}
function typeAllowed(t){
  t = (t||'').toLowerCase();
  if(t==='d2' || t==='d2 football') return layerOn('lyD2');
  if(t==='d3' || t==='d3 football') return layerOn('lyD3');
  if(t==='golf') return layerOn('lyGolf');
  if(t==='milb') return layerOn('lyMiLB', true);
  if(t==='practice') return layerOn('lyPractice', true);
  if(t==='nfl') return layerOn('lyNFL', true);
  if(t==='mlb') return layerOn('lyMLB', true);
  if(t==='soccer'||t==='mls'||t==='nwsl') return layerOn('lySoccer', true);
  if(t==='college'||t==='d1') return layerOn('lyD1', true) || layerOn('lyCollege', true);
  return true;
}

function tickClock(){
  const now = new Date();
  const opts = {weekday:'short', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, timeZoneName:'short'};
  const parts = now.toLocaleString('en-GB', opts).toUpperCase().replace(/,/g,'');
  const el = document.getElementById('liveClock');
  if(el) el.textContent = parts;
}


/* Intel ticker — Big Money + Sleepers only (not a dupe of Event intel rail) */
(function loadIntelDesk(){
  const body = document.getElementById('intelBody');
  const updated = document.getElementById('intelUpdated');
  if(!body) return;
  const esc = (s)=>String(s||'').replace(/</g,'');
  const itemHtml = (it)=>{
    const tag = esc(it.tag||'NOTE');
    const title = esc(it.title||'');
    const note = esc(it.note||'');
    const url = String(it.url||'#').replace(/"/g,'');
    const ext = /^https?:/i.test(url);
    const noteHtml = note ? `<span class="soc-ticker-sep">·</span><span class="soc-ticker-note">${note}</span>` : '';
    return `<a class="soc-ticker-item" href="${url}"${ext?' target="_blank" rel="noopener"':''}><span class="soc-ticker-tag">${tag}</span><span class="soc-ticker-title">${title}</span>${noteHtml}</a>`;
  };
  const section = (label, cls, items)=>{
    if(!items || !items.length) return '';
    const head = `<span class="soc-ticker-section ${cls}">${label}</span>`;
    return head + items.map(itemHtml).join('');
  };
  const render = (data)=>{
    const big = (data && (data.big_money || data.bigMoney)) || [];
    const sleep = (data && (data.sleepers || data.sleeper_picks)) || [];
    /* legacy fallback: items[] split by kind */
    let legacy = (data && data.items) || [];
    if(!big.length && !sleep.length && legacy.length){
      legacy.forEach(it=>{
        const k = (it.kind||it.bucket||'').toLowerCase();
        if(k.indexOf('sleep')>=0) sleep.push(it); else big.push(it);
      });
    }
    if(updated){
      try{
        const d = data.updated ? new Date(data.updated) : null;
        updated.textContent = d ? d.toLocaleString(undefined,{month:'short',day:'numeric'}) : '';
      }catch(e){ updated.textContent=''; }
    }
    if(!big.length && !sleep.length){
      body.innerHTML = '<span class="soc-ticker-loading">No ticker highlights — update sports/intel.json</span>';
      body.style.animation = 'none';
      return;
    }
    const piece = section('BIG MONEY', 'sec-big', big.slice(0,3)) + section('SLEEPER PICKS', 'sec-sleep', sleep.slice(0,3));
    body.innerHTML = piece + piece;
    const n = Math.min(3,big.length) + Math.min(3,sleep.length);
    body.style.animationDuration = Math.max(28, n * 10) + 's';
  };
  fetch('./intel.json', {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('intel '+r.status); return r.json(); })
    .then(render)
    .catch(()=>{ body.innerHTML = '<span class="soc-ticker-loading">Intel offline</span>'; body.style.animation='none'; });
})();

tickClock(); setInterval(tickClock, 1000);

/* Mobile drawers */
(function(){
  const scrim = document.getElementById('mobileScrim');
  const btnL = document.getElementById('btnLayers');
  const btnF = document.getElementById('btnFeed');
  function closeMobileDrawers(){
    document.body.classList.remove('mobile-layers-open','mobile-feed-open');
    btnL && btnL.classList.remove('active');
    btnF && btnF.classList.remove('active');
    setTimeout(function(){ try{ map.invalidateSize(); }catch(e){} }, 300);
  }
  function openLayers(){
    document.body.classList.remove('mobile-feed-open');
    btnF && btnF.classList.remove('active');
    document.body.classList.add('mobile-layers-open');
    btnL && btnL.classList.add('active');
  }
  function openFeed(){
    document.body.classList.remove('mobile-layers-open');
    btnL && btnL.classList.remove('active');
    document.body.classList.add('mobile-feed-open');
    btnF && btnF.classList.add('active');
  }
  btnL && btnL.addEventListener('click', function(){
    if(document.body.classList.contains('mobile-layers-open')) closeMobileDrawers();
    else openLayers();
  });
  btnF && btnF.addEventListener('click', function(){
    if(document.body.classList.contains('mobile-feed-open')) closeMobileDrawers();
    else openFeed();
  });
  scrim && scrim.addEventListener('click', closeMobileDrawers);
  window.addEventListener('resize', function(){
    if(window.innerWidth > 900) closeMobileDrawers();
    try{ map.invalidateSize(); }catch(e){}
  });
  // after panel open, fix map size on mobile
  const _obs = document.getElementById('panel');
  if(_obs && window.MutationObserver){
    new MutationObserver(function(){
      setTimeout(function(){ try{ map.invalidateSize(); }catch(e){} }, 280);
    }).observe(_obs, {attributes:true, attributeFilter:['class']});
  }
})();
