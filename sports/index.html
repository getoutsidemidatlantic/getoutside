<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ops Center - Get Outside Mid-Atlantic</title>
<style>
body{margin:0;background:#0b1220;color:#e8eef7;font-family:system-ui,sans-serif}
#boot{padding:2.5rem;text-align:center;line-height:1.6;max-width:36rem;margin:0 auto}
a{color:#7dd3fc}
</style>
</head>
<body>
<div id="boot">Loading Ops Center...</div>
<script>
(async function () {
  const boot = document.getElementById('boot');
  function fail(msg) {
    boot.innerHTML = '<p style="font-size:1.15rem;font-weight:600">Ops Center failed to load</p><p style="opacity:.8">'+(msg||'')+'</p><p><a href="/">Home</a></p>';
  }
  try {
    window.location.replace('./map.html');
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
