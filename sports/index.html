<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"/>
<title>Get Outside Mid-Atlantic · Ops Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./ops-layers.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0b1220;color:#e8eef7;overflow:hidden}
header{background:#020617;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e3a55;min-height:56px;z-index:1100;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#0b1220}
.brand-text{font-weight:700;font-size:.95rem}.brand-sub{font-size:.65rem;color:#6b7f9a}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{background:#1a7f4e;color:#fff;font-size:.7rem;padding:3px 9px;border-radius:999px;font-weight:600}
.time-filters{display:flex;gap:4px}.time-filters button{background:rgba(255,255,255,.06);border:1px solid #2a4a6a;color:#a8b8d0;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}.time-filters button.active{background:#22c55e;border-color:#22c55e;color:#0b1220}
.kofi-btn{display:inline-flex;align-items:center;gap:5px;background:#ff5e5b;color:#fff;font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:999px;text-decoration:none;border:none;cursor:pointer;white-space:nowrap}
.kofi-btn:hover{background:#ff7573;color:#fff}
#main{display:flex;height:calc(100vh - 48px);padding-bottom:36px}
#layers{width:240px;min-width:200px;background:#0a1220;border-right:1px solid #1e3a55;overflow-y:auto;z-index:600;display:flex;flex-direction:column;transition:transform .28s ease}
.layers-top{padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid #1e3a55}
.layers-top-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7dd3fc}
.layers-actions{display:flex;gap:4px}
.layers-actions button{background:rgba(255,255,255,.06);border:1px solid #2a4a6a;color:#a8b8d0;font-size:.65rem;padding:3px 8px;border-radius:4px;cursor:pointer}
.layer-item{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:.8rem;cursor:pointer;color:#c5d4e8}
.layer-item:hover{background:rgba(255,255,255,.04)}
.layer-item input{accent-color:#22c55e}
.layer-swatch{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.layer-swatch.heat{background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
.layer-count{margin-left:auto;font-size:.7rem;color:#6b7f9a}
#map{flex:1;height:100%;position:relative;min-width:0}
#feed{width:320px;min-width:0;background:#0a1220;border-left:1px solid #1e3a55;display:flex;flex-direction:column;z-index:600;transition:width .28s ease,min-width .28s ease;position:relative;flex-shrink:0}
#feed.collapsed{width:36px;min-width:36px}
#feed.collapsed .feed-header-text,#feed.collapsed #feedCount,#feed.collapsed #feedMarquee,#feed.collapsed #feedScroll{display:none}
#feed.collapsed .feed-header{padding:10px 4px;justify-content:center}
.feed-header{padding:10px 12px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7f9a;font-weight:700;border-bottom:1px solid #1e3a55;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0}
.feed-header-left{display:flex;align-items:center;gap:8px;min-width:0}
.feed-collapse-btn{background:rgba(255,255,255,.06);border:1px solid #2a4a6a;color:#a8b8d0;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feed-collapse-btn:hover{background:rgba(255,255,255,.1);color:#e8eef7}
#feedMarquee{flex-shrink:0;max-height:42%;overflow:hidden;padding:8px 8px 0;border-bottom:1px solid #1e3a55}
#feedMarquee:empty{display:none;padding:0;border:none}
#feedScroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0}
#feedScroll::-webkit-scrollbar{width:6px}
#feedScroll::-webkit-scrollbar-thumb{background:#2a4a6a;border-radius:3px}
.marquee-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f59e0b;padding:2px 4px 6px}
.feed-card{background:rgba(255,255,255,.03);border:1px solid #1e3a55;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.feed-card:hover{background:rgba(255,255,255,.06)}
.feed-card.marquee{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.06)}
.feed-card-date{font-size:.68rem;color:#38bdf8;font-weight:600}
.feed-card-title{font-size:.88rem;font-weight:600;margin-top:2px}
.feed-card-meta{font-size:.72rem;color:#8ba0bc;margin-top:3px}
.feed-card-wx{font-size:.7rem;color:#94a3b8;margin-top:4px;display:none}
body.show-weather .feed-card-wx{display:block}
.fc-hype{font-size:.72rem;color:#a8b8d0;margin-top:6px;line-height:1.35;display:none}
body.show-hype .fc-hype{display:block}
.mobile-bar{display:none;position:fixed;bottom:36px;left:0;right:0;height:48px;background:#0a1220;border-top:1px solid #1e3a55;z-index:1250;padding:0 8px;gap:8px;align-items:center}
.mobile-bar button{flex:1;height:36px;border:1px solid #2a4a6a;background:rgba(255,255,255,.04);color:#c5d4e8;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer}
.mobile-bar button.active{background:#1a7f4e;border-color:#1a7f4e;color:#fff}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1150}
@media (max-width:900px){
  #layers,#feed{position:fixed;top:56px;bottom:84px;width:min(320px,90vw);transform:translateX(-110%);transition:transform .28s ease;z-index:1200;border:1px solid #1e3a55;border-radius:0 10px 10px 0}
  #feed{right:0;left:auto;transform:translateX(110%);border-radius:10px 0 0 10px;width:min(320px,90vw)!important;min-width:0!important}
  #feed.collapsed{width:min(320px,90vw)!important}
  #feed.collapsed .feed-header-text,#feed.collapsed #feedCount,#feed.collapsed #feedMarquee,#feed.collapsed #feedScroll{display:block}
  body.mobile-layers-open #layers,body.mobile-feed-open #feed{transform:translateX(0)}
  body.mobile-layers-open .scrim,body.mobile-feed-open .scrim{display:block}
  .mobile-bar{display:flex}
  #main{height:calc(100vh - 92px);padding-bottom:0}
  .kofi-btn span.kofi-label{display:none}
  #feed .feed-collapse-btn{display:none}
}
#panel{position:fixed;top:56px;right:0;bottom:36px;width:min(360px,100vw);background:#0a1220;border-left:1px solid #1e3a55;z-index:1300;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:translateX(0)}
.panel-hero{width:100%;height:140px;object-fit:cover;display:block;background:#0b1220;border-bottom:1px solid #1e3a55}
.panel-hero-fallback{width:100%;padding:16px;text-align:center;color:#7dd3fc;font-size:.75rem;border-bottom:1px solid #1e3a55}
.occasion-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;width:100%}
.panel-header{padding:12px 14px;border-bottom:1px solid #1e3a55;position:relative}
.panel-close{position:absolute;top:10px;right:12px;background:none;border:none;color:#a8b8d0;font-size:1.4rem;cursor:pointer}
.panel-venue{font-size:1.05rem;font-weight:700;padding-right:24px}
.panel-city{font-size:.75rem;color:#6b7f9a;margin-top:2px}
.panel-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:.65rem;padding:2px 8px;border-radius:999px;background:#1e3a55;color:#c5d4e8}
.chip.count{background:#1a7f4e;color:#fff}
.chip.occasion{background:#0f766e;color:#ccfbf1}
.panel-body{flex:1;overflow-y:auto;padding:12px 14px}
.panel-section-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7dd3fc;margin:10px 0 4px}
.event-card{background:#111827;border:1px solid #1e3a55;border-radius:8px;padding:10px;margin-bottom:8px}
.event-date{font-size:.7rem;color:#7dd3fc}
.event-teams{font-size:.85rem;font-weight:600;margin:2px 0}
.event-sport{font-size:.7rem;color:#6b7f9a}
#statusBar{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1a7f4e;color:#fff;font-size:.75rem;padding:6px 14px;border-radius:999px;z-index:1300;display:none}
#statusBar.err{background:#7f1d1d}
#ticker{position:fixed;bottom:0;left:0;right:0;height:36px;background:#020617;border-top:1px solid #1e3a55;display:flex;align-items:center;overflow:hidden;z-index:1100}
#tickerContent{white-space:nowrap;font-size:.72rem;color:#a8b8d0;padding-left:100%;animation:ticker 40s linear infinite}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.soc-icon{width:28px;height:28px;border-radius:50%;background:#1e3a55;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #22c55e;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.soc-icon.nfl{border-color:#3b82f6}.soc-icon.mlb{border-color:#ef4444}.soc-icon.soccer{border-color:#22c55e}
.soc-icon.college{border-color:#a78bfa}.soc-icon.milb{border-color:#f59e0b}
.field-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #0b1220;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.wx-chip{position:absolute;bottom:-6px;right:-6px;background:#0ea5e9;color:#fff;font-size:9px;padding:1px 4px;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">
    <div class="brand-mark">GO</div>
    <div><div class="brand-text">Ops Center</div><div class="brand-sub">Get Outside Mid-Atlantic</div></div>
  </a>
  <div class="header-right">
    <div class="time-filters">
      <button data-range="7">7d</button>
      <button data-range="14">14d</button>
      <button class="active" data-range="30">30d</button>
    </div>
    <span class="badge" id="liveClock">LIVE</span>
    <a class="kofi-btn" href="https://ko-fi.com/getoutsidematl" target="_blank" rel="noopener">☕ <span class="kofi-label">Support</span></a>
  </div>
</header>
<div id="main">
  <aside id="layers">
    <div class="layers-top">
      <span class="layers-top-label">Layers</span>
      <div class="layers-actions">
        <button type="button" id="btnSelectAll">Select all</button>
        <button type="button" id="btnClearLayers">Clear all</button>
      </div>
    </div>
    <div class="ops-global-toggles" style="padding:6px 0 4px;border-bottom:1px solid #1e3a55">
      <label class="layer-item"><input type="checkbox" id="lyWeather"> <span class="layer-swatch" style="background:#38bdf8">☁</span> Weather vibes</label>
      <label class="layer-item"><input type="checkbox" id="lyHype"> <span class="layer-swatch" style="background:#16a34a">⚡</span> Hype</label>
      <label class="layer-item"><input type="checkbox" id="lyHeat"> <span class="layer-swatch heat"></span> Density heatmap</label>
    </div>
    <div class="ops-group" id="ops-sports">
      <button type="button" class="ops-group-toggle" aria-expanded="true" data-target="ops-sports-body"><span>Sports</span><span class="ops-group-chevron">▾</span></button>
      <div class="ops-group-body" id="ops-sports-body" style="display:block">
        <label class="layer-item"><input type="checkbox" checked data-type="nfl"> <span class="layer-swatch" style="background:#1d4ed8">🏈</span> NFL <span class="layer-count" data-count="nfl">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="mlb"> <span class="layer-swatch" style="background:#dc2626">⚾</span> MLB <span class="layer-count" data-count="mlb">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="soccer"> <span class="layer-swatch" style="background:#16a34a">⚽</span> Soccer <span class="layer-count" data-count="soccer">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="practice"> <span class="layer-swatch" style="background:#f59e0b">🏈</span> Practice <span class="layer-count" data-count="practice">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="college"> <span class="layer-swatch" style="background:#7c3aed">🏈</span> College <span class="layer-count" data-count="college">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="milb"> <span class="layer-swatch" style="background:#b45309">⚾</span> MiLB <span class="layer-count" data-count="milb">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="d2"> <span class="layer-swatch" style="background:#6366f1">🏈</span> D2 / D3 <span class="layer-count" data-count="d2">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="golf"> <span class="layer-swatch" style="background:#0d9488">⛳</span> Golf <span class="layer-count" data-count="golf">0</span></label>
      </div>
    </div>
  </aside>
  <div id="map"></div>
  <aside id="feed">
    <div class="feed-header">
      <div class="feed-header-left">
        <button type="button" class="feed-collapse-btn" id="btnFeedCollapse" title="Collapse feed" aria-label="Collapse live feed">›</button>
        <span class="feed-header-text">Live Feed</span>
      </div>
      <span id="feedCount">0 events</span>
    </div>
    <div id="feedMarquee"></div>
    <div id="feedScroll"></div>
  </aside>
</div>
<div class="mobile-bar">
  <button type="button" id="btnLayers">Layers</button>
  <button type="button" id="btnFeed">Feed</button>
</div>
<div class="scrim" id="scrim"></div>
<div id="panel">
  <div id="panelHeroWrap"></div>
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">×</button>
    <div class="panel-venue" id="panelVenue">Venue</div>
    <div class="panel-city" id="panelCity"></div>
    <div class="panel-chips" id="panelChips"></div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>
<div id="statusBar"></div>
<div id="ticker"><div id="tickerContent">Ops Center · Mid-Atlantic outdoor action</div></div>
<script src="./ops-core.js"></script>
<script src="./map-app.js"></script>
<script src="./intel-boot.js"></script>
</body>
</html>
