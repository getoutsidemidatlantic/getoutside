<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"/>
<title>Get Outside Mid-Atlantic · Ops Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./ops-layers.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0b1220;color:#e8eef7;overflow:hidden}
header{background:#020617;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e3a55;min-height:56px;z-index:1100;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-mark{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#0b1220}
.brand-text{font-weight:700;font-size:.95rem}.brand-sub{font-size:.65rem;color:#6b7f9a}
.header-right{display:flex;align-items:center;gap:10px}
.badge{background:#1a7f4e;color:#fff;font-size:.7rem;padding:3px 9px;border-radius:999px;font-weight:600}
.defcon{font-size:.65rem;font-weight:800;padding:3px 8px;border-radius:4px}.defcon.d5{background:#7f1d1d;color:#fecaca}
.time-filters{display:flex;gap:4px}.time-filters button{background:rgba(255,255,255,.06);border:1px solid #2a4a6a;color:#a8b8d0;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}.time-filters button.active{background:#22c55e;border-color:#22c55e;color:#0b1220}
.kofi-btn{display:inline-flex;align-items:center;gap:5px;background:#ff5e5b;color:#fff;font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:999px;text-decoration:none;border:none;cursor:pointer;white-space:nowrap}
.kofi-btn:hover{background:#ff7573;color:#fff}
.kofi-btn svg{width:14px;height:14px;flex-shrink:0}
#main{display:flex;height:calc(100vh - 48px);padding-bottom:36px}
#layers{width:240px;min-width:200px;background:#0a1220;border-right:1px solid #1e3a55;overflow-y:auto;z-index:600;display:flex;flex-direction:column}
.layers-top{padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid #1e3a55}
.layers-top-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#7dd3fc;font-weight:700;font-family:'Share Tech Mono',ui-monospace,monospace}
.layers-actions{display:flex;gap:4px}.layers-actions button{font-size:.6rem;font-weight:700;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer}
.layer-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;color:#c5d4e8;font-size:.8rem;font-family:'Share Tech Mono',ui-monospace,monospace;letter-spacing:.04em}
.layer-item:hover{background:rgba(255,255,255,.04)}.layer-item input{accent-color:#38bdf8;width:14px;height:14px;flex-shrink:0}
.layer-swatch{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid rgba(255,255,255,.25);flex-shrink:0}
.layer-swatch.heat{background:linear-gradient(90deg,#3b82f6,#22c55e,#eab308,#ef4444);border-radius:3px}
.layer-count{font-size:.65rem;color:#6b7f9a;margin-left:auto}
#map{flex:1;min-height:300px;background:#0b1220;min-width:0}
#feed{width:320px;min-width:0;background:#0a1220;border-left:1px solid #1e3a55;display:flex;flex-direction:column;z-index:600;transition:width .28s ease;position:relative;flex-shrink:0}
#feed.collapsed{width:36px;min-width:36px}
#feed.collapsed .feed-header-text,#feed.collapsed #feedCount,#feed.collapsed #feedScroll{display:none}
.feed-header{padding:10px 12px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7f9a;font-weight:700;border-bottom:1px solid #1e3a55;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0}
.feed-header-left{display:flex;align-items:center;gap:8px;min-width:0}
.feed-collapse-btn{background:rgba(255,255,255,.06);border:1px solid #2a4a6a;color:#a8b8d0;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#feedScroll{flex:1;overflow-y:auto;padding:8px;min-height:0;-webkit-overflow-scrolling:touch}
.feed-card{background:rgba(255,255,255,.03);border:1px solid #1e3a55;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.feed-card:hover{background:rgba(255,255,255,.06)}.feed-card.marquee{border-color:#f59e0b55;background:rgba(245,158,11,.06)}
.feed-card-date{font-size:.68rem;color:#38bdf8;font-weight:600}.feed-card-title{font-size:.88rem;font-weight:600;margin-top:2px}.feed-card-meta{font-size:.72rem;color:#8ba0bc;margin-top:3px}
.feed-card-wx{font-size:.7rem;color:#94a3b8;margin-top:4px;display:none}body.show-weather .feed-card-wx{display:block}
.fc-hype{font-size:.68rem;color:#86efac;margin-top:3px;line-height:1.3;display:none;font-style:italic}body.show-hype .fc-hype{display:block}
.marquee-label{font-size:.62rem;text-transform:uppercase;color:#f59e0b;font-weight:700;padding:4px 2px 6px}
#ticker{position:fixed;bottom:0;left:0;right:0;height:36px;background:#020617;border-top:1px solid #1e3a55;display:flex;align-items:center;z-index:1300;font-size:.75rem}
.ticker-label{padding:0 12px;font-weight:700;color:#38bdf8;border-right:1px solid #1e3a55;height:100%;display:flex;align-items:center}
.ticker-track{flex:1;overflow:hidden}.ticker-content{display:inline-block;white-space:nowrap;padding-left:100%;animation:ticker 55s linear infinite;line-height:36px;color:#a8b8d0}@keyframes ticker{to{transform:translateX(-100%)}}
.soc-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.soc-icon.nfl,.soc-icon.practice,.soc-icon.college,.soc-icon.d2,.soc-icon.d3{background:#1d4ed8}.soc-icon.mlb,.soc-icon.milb{background:#dc2626}.soc-icon.soccer,.soc-icon.mls{background:#16a34a}.soc-icon.golf{background:#0d9488}
.wx-chip{position:absolute;bottom:-4px;right:-6px;background:#0ea5e9;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:4px;border:1px solid #fff;display:none}body.show-weather .wx-chip{display:block}
#panel{position:fixed;top:48px;right:-420px;width:380px;max-width:90vw;height:calc(100vh - 48px);background:#0f1a2e;border-left:1px solid #2a4a6a;z-index:1200;transition:right .28s;display:flex;flex-direction:column}#panel.open{right:0}
.panel-header{padding:14px 16px;background:linear-gradient(135deg,#1b4f72,#0f1c2e);border-bottom:1px solid #2a4a6a}.panel-close{float:right;background:none;border:none;color:#8ba0bc;font-size:22px;cursor:pointer}
.panel-venue{font-weight:700;font-size:1.05rem;color:#7dd3fc}.panel-city{font-size:.8rem;color:#a8b8d0}.panel-chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08)}.chip.count{background:#1a7f4e;color:#fff}
.panel-hero{width:100%;height:140px;object-fit:cover;display:block;background:#0b1220;border-bottom:1px solid #1e3a55}
.panel-hero-fallback{width:100%;padding:16px;text-align:center;color:#7dd3fc;font-size:.75rem;border-bottom:1px solid #1e3a55}
.occasion-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;width:100%}
.chip.occasion{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fbbf24}
.panel-body{flex:1;overflow-y:auto;padding:12px 14px}.panel-section-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:#6b7f9a;margin:4px 0 8px;font-weight:600}
.event-card{background:rgba(255,255,255,.04);border:1px solid #1e3a55;border-radius:10px;margin-bottom:10px;padding:10px 12px}
.event-date{font-size:.7rem;color:#38bdf8;font-weight:600}.event-teams{font-size:.88rem;font-weight:600;margin-top:2px}.event-sport{font-size:.7rem;color:#8ba0bc;margin-top:2px}
#statusBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:650;background:rgba(15,23,42,.9);border:1px solid #1e3a55;padding:6px 14px;border-radius:999px;font-size:.72rem;color:#94a3b8;pointer-events:none}#statusBar.ok{color:#4ade80;border-color:#16a34a55}#statusBar.err{color:#f87171}
.popup-mini-title{font-weight:700;color:#7dd3fc}.popup-mini-meta{font-size:.75rem;color:#a8b8d0;margin-top:2px}.popup-wx{font-size:.72rem;color:#94a3b8;margin-top:4px}.popup-mini-btn{margin-top:8px;background:#1e40af;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;width:100%}
.mobile-bar{display:none;position:fixed;bottom:36px;left:0;right:0;height:48px;background:#0a1220;border-top:1px solid #1e3a55;z-index:1250;padding:0 8px;gap:8px;align-items:center}.mobile-bar button{flex:1;height:36px;border:1px solid #2a4a6a;background:rgba(255,255,255,.04);color:#c5d4e8;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1150}
@media(max-width:900px){#layers,#feed{position:fixed;top:56px;bottom:84px;width:min(320px,90vw);transform:translateX(-110%);transition:transform .28s;z-index:1200}#feed{right:0;left:auto;transform:translateX(110%);width:min(320px,90vw)!important}body.mobile-layers-open #layers,body.mobile-feed-open #feed{transform:translateX(0)}body.mobile-layers-open .scrim,body.mobile-feed-open .scrim{display:block}.mobile-bar{display:flex}#main{height:calc(100vh - 92px)}.kofi-btn span.kofi-label{display:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><div class="brand-mark">GO</div><div><div class="brand-text">Get Outside</div><div class="brand-sub">Ops Center</div></div></a>
  <div class="header-right">
    <div class="time-filters"><button class="active" data-range="7">7d</button><button data-range="14">14d</button><button data-range="30">30d</button></div>
    <a class="kofi-btn" href="https://ko-fi.com/getoutsidemidatlantic" target="_blank" rel="noopener" title="Support on Ko-fi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.722c-.58 0-.661.743-.661.743L0 17.497s.063.754.661.754h4.87s.052-.069.09-.2c.514-1.715 1.66-4.788 5.504-4.788 3.532 0 4.584 2.724 5.087 4.788.03.107.08.2.08.2h5.878s.546-.093.546-.743l-.239-8.56zM16.86 6.89c.7 0 1.268.567 1.268 1.268 0 .7-.567 1.268-1.268 1.268-.7 0-1.268-.567-1.268-1.268 0-.7.567-1.268 1.268-1.268z"/></svg><span class="kofi-label">Ko-fi</span></a>
    <span class="badge" id="liveClock">--:--</span>
    <span class="defcon d5">D5</span>
  </div>
</header>
<div id="main">
  <aside id="layers">
    <div class="layers-top"><span class="layers-top-label">Layers</span><div class="layers-actions"><button type="button" id="btnSelectAll">Select all</button><button type="button" id="btnClearLayers">Clear all</button></div></div>
    <div class="ops-global-toggles" style="padding:6px 0 4px;border-bottom:1px solid #1e3a55">
      <label class="layer-item"><input type="checkbox" id="lyWeather"> <span class="layer-swatch" style="background:#38bdf8">☁</span> Weather vibes</label>
      <label class="layer-item"><input type="checkbox" id="lyHype"> <span class="layer-swatch" style="background:#16a34a">⚡</span> Hype</label>
      <label class="layer-item"><input type="checkbox" id="lyHeat"> <span class="layer-swatch heat"></span> Density heatmap</label>
    </div>
    <div class="ops-group" id="ops-sports">
      <button type="button" class="ops-group-toggle" aria-expanded="true" data-target="ops-sports-body"><span>Sports</span><span class="ops-group-chevron">▾</span></button>
      <div class="ops-group-body" id="ops-sports-body" style="display:block">
        <label class="layer-item"><input type="checkbox" checked data-type="nfl"> <span class="layer-swatch" style="background:#1d4ed8">🏈</span> NFL <span class="layer-count" id="cnt-nfl">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="mlb"> <span class="layer-swatch" style="background:#dc2626">⚾</span> MLB <span class="layer-count" id="cnt-mlb">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="soccer"> <span class="layer-swatch" style="background:#16a34a">⚽</span> Soccer <span class="layer-count" id="cnt-soccer">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="practice"> <span class="layer-swatch" style="background:#f59e0b">🏈</span> Practice <span class="layer-count" id="cnt-practice">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="college"> <span class="layer-swatch" style="background:#7c3aed">🏈</span> College <span class="layer-count" id="cnt-college">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="milb"> <span class="layer-swatch" style="background:#b45309">⚾</span> MiLB <span class="layer-count" id="cnt-milb">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="d2"> <span class="layer-swatch" style="background:#6366f1">🏈</span> D2 / D3 <span class="layer-count" id="cnt-d2">0</span></label>
        <label class="layer-item"><input type="checkbox" checked data-type="golf"> <span class="layer-swatch" style="background:#0d9488">⛳</span> Golf <span class="layer-count" id="cnt-golf">0</span></label>
      </div>
    </div>
  </aside>
  <div id="map"><div id="statusBar">Loading…</div></div>
  <aside id="feed">
    <div class="feed-header"><div class="feed-header-left"><button type="button" class="feed-collapse-btn" id="btnFeedCollapse" title="Collapse feed">›</button><span class="feed-header-text">Live Feed</span></div><span id="feedCount">0 events</span></div>
    <div id="feedScroll"></div>
  </aside>
</div>
<div class="mobile-bar"><button id="btnLayers">Layers</button><button id="btnFeed">Feed</button></div>
<div class="scrim" id="scrim"></div>
<div id="panel"><div id="panelHeroWrap"></div><div class="panel-header"><button class="panel-close" onclick="closePanel()">×</button><div class="panel-venue" id="panelVenue">Venue</div><div class="panel-city" id="panelCity"></div><div class="panel-chips" id="panelChips"></div></div><div class="panel-body" id="panelBody"></div></div>
<div id="ticker"><div class="ticker-label">TICKER</div><div class="ticker-track"><div class="ticker-content" id="tickerContent">Loading…</div></div></div>
<script src="./ops-core.js"></script>
<script src="./map-app.js" defer></script>
</body>
</html>
