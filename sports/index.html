<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ops Center · Get Outside Mid-Atlantic</title>
<style>
body{margin:0;background:#0b1220;color:#e8eef7;font-family:system-ui,sans-serif}
#boot{padding:2.5rem;text-align:center;line-height:1.6;max-width:36rem;margin:0 auto}
a{color:#7dd3fc}
</style>
</head>
<body>
<div id="boot">Loading Ops Center…</div>
<script>
(async function () {
  const boot = document.getElementById('boot');
  function fail(msg) {
    boot.innerHTML = '<p style="font-size:1.15rem;font-weight:600">Ops Center failed to load</p><p style="opacity:.8">'+(msg||'')+'</p><p><a href="/">← Home</a></p>';
  }
  function paint(html) {
    document.open(); document.write(html); document.close();
    try {
      const link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = './ops-layers.css';
      (document.head||document.documentElement).appendChild(link);
    } catch(e){}
  }
  async function gunzipBase64(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new TextDecoder().decode(await new Response(stream).arrayBuffer());
  }
  try {
    const r = await fetch('./map.b64.txt', { cache: 'no-store' });
    if (!r.ok) throw new Error('map.b64.txt HTTP ' + r.status);
    const html = await gunzipBase64((await r.text()).trim());
    if (html.indexOf('<!DOCTYPE') === -1) throw new Error('Decoded payload is not HTML');
    paint(html);
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
